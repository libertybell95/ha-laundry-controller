name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c "import json;print(json.load(open('custom_components/laundry_controller/manifest.json'))['version'])")
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest version $version" >&2
            exit 1
          fi
      - name: Zip integration
        run: cd custom_components/laundry_controller && zip -r ../../laundry_controller.zip . -x '__pycache__/*'
      - name: Attach zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" laundry_controller.zip --clobber
